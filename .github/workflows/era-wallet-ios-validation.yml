name: ERA Wallet iOS unsigned validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed iOS commit SHA containing the published build9 fixes
        required: true
        type: string
      capture_ipad_screenshot:
        description: Capture a genuine first-run 13-inch iPad simulator screen from the exact source
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: era-wallet-ios-validation
  cancel-in-progress: false

jobs:
  provenance:
    if: github.repository == 'erablockchains/apps' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Check out reviewed workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release-source provenance before using a Mac runner
        id: verify
        env:
          ERA_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/scripts/verify-era-ios-source.py --source-sha "$ERA_SOURCE_SHA"

  unsigned-ios:
    needs: provenance
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        working-directory: era-wallet
        shell: bash
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - name: Record native toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test "${xcode_version%%.*}" -ge 26
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iOS SDK %s\n' "$ios_sdk"
          test "${ios_sdk%%.*}" -ge 26
          pod --version
      - name: Install checksum-pinned Flutter 3.41.9
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive=flutter_macos_arm64_3.41.9-stable.zip
              digest=d692b030a63466c44d6b2bc88583380371ecbe328f22cc4057835f59739821a1
              ;;
            x86_64)
              archive=flutter_macos_3.41.9-stable.zip
              digest=eaee3b6aa6da114eb0be843ac53f4f138d3d8827779ff1e4546b345c75b9cba1
              ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 2 --max-time 900 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive" \
            --output "$RUNNER_TEMP/flutter-sdk.zip"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/flutter-sdk.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/era-flutter"
          ditto -x -k "$RUNNER_TEMP/flutter-sdk.zip" "$RUNNER_TEMP/era-flutter"
          rm "$RUNNER_TEMP/flutter-sdk.zip"
          test "$(git -C "$RUNNER_TEMP/era-flutter/flutter" rev-parse HEAD)" = 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
          echo "$RUNNER_TEMP/era-flutter/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies and prepare iOS toolchain
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          flutter --version
          flutter precache --ios
          flutter pub get --enforce-lockfile
      - name: Analyze and run existing synthetic tests
        run: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Compile unsigned iOS release and simulator app
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug
      - name: Record compiled identity and limits
        env:
          ERA_SOURCE_SHA: ${{ needs.provenance.outputs.source_sha }}
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.eraprojects.erawallet
          {
            echo '## Unsigned iOS validation passed'
            printf 'Source: `%s`\n\n' "$ERA_SOURCE_SHA"
            xcodebuild -version
            echo
            shasum -a 256 build/ios/iphoneos/Runner.app/Runner
            echo
            echo 'No signing credentials were used; no IPA, TestFlight upload or App Review submission was produced.'
            echo 'Simulator compilation is not UI testing or physical-device qualification.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture first-run screen on a fresh 13-inch iPad simulator
        if: inputs.capture_ipad_screenshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          def sim_list(kind):
              return json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', kind, '-j']))

          types = sim_list('devicetypes')['devicetypes']
          matches = [item for item in types if 'iPad Pro 13-inch' in item['name']]
          if not matches:
              raise SystemExit('No 13-inch iPad Pro simulator device type is installed')
          runtimes = sim_list('runtimes')['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS simulator runtime is installed')
          ios.sort(key=lambda item: tuple(int(part) for part in item['version'].split('.')), reverse=True)
          device = matches[-1]
          runtime = ios[0]
          uuid = subprocess.check_output(['xcrun', 'simctl', 'create', 'ERA Wallet App Store iPad 13', device['identifier'], runtime['identifier']], text=True).strip()
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'era-ipad-simulator-uuid'), 'w', encoding='utf-8') as out:
              out.write(uuid)
          print('Simulator:', device['name'], runtime['name'], uuid)
          PY
          uuid="$(cat "$RUNNER_TEMP/era-ipad-simulator-uuid")"
          xcrun simctl boot "$uuid"
          xcrun simctl bootstatus "$uuid" -b
          xcrun simctl install "$uuid" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$uuid" com.eraprojects.erawallet
          sleep 12
          capture="$RUNNER_TEMP/era-wallet-ipad-13-build11.png"
          xcrun simctl io "$uuid" screenshot "$capture"
          width="$(sips -g pixelWidth "$capture" | awk '/pixelWidth/{print $2}')"
          height="$(sips -g pixelHeight "$capture" | awk '/pixelHeight/{print $2}')"
          case "$width x $height" in
            '2048 x 2732'|'2064 x 2752') ;;
            *) echo "Unexpected iPad screenshot dimensions: $width x $height" >&2; exit 1 ;;
          esac
          shasum -a 256 "$capture"
          printf '\nFresh simulator first-run screenshot: %s x %s. Inspect the image before App Store upload; this is not physical-device qualification.\n' "$width" "$height" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain iPad screenshot for visual review
        if: inputs.capture_ipad_screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: era-wallet-ipad-13-build11-first-run
          path: ${{ runner.temp }}/era-wallet-ipad-13-build11.png
          if-no-files-found: error
          retention-days: 7

# Deliberately no push/PR triggers, secrets, cache or signed binary uploads.
