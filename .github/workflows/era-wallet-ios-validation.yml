name: ERA Wallet iOS unsigned validation

on:
  workflow_dispatch:
    inputs:
      capture_review_guide:
        description: Run first-launch and synthetic-flow capture on a fresh 11-inch iPad simulator
        required: false
        default: false
        type: boolean
      simulator_runner:
        description: Standard free public-repository simulator host (Intel fallback if Apple-silicon capacity is unavailable)
        required: false
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-15-intel
      source_sha:
        description: Full reviewed iOS commit SHA containing the published build9 fixes
        required: true
        type: string
      capture_ipad_screenshot:
        description: Capture a genuine first-run 13-inch iPad simulator screen from the exact source
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: era-wallet-ios-validation
  cancel-in-progress: false

jobs:
  provenance:
    if: github.repository == 'erablockchains/apps' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Check out reviewed workflow implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release-source provenance before using a Mac runner
        id: verify
        env:
          ERA_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/scripts/verify-era-ios-source.py --source-sha "$ERA_SOURCE_SHA"

  unsigned-ios:
    needs: provenance
    # Standard public-repository Apple-silicon runner. Intel first boot stalled
    # in KeychainMigrator before ERA launched in run 44384483918. The macOS15
    # image includes Xcode26.3; select it rather than the image's Xcode16 default.
    # Map choices to a fixed standard-runner allowlist; never accept a paid label.
    runs-on: ${{ inputs.simulator_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 75
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: era-wallet
        shell: bash
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - name: Record native toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test "${xcode_version%%.*}" -ge 26
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iOS SDK %s\n' "$ios_sdk"
          test "${ios_sdk%%.*}" -ge 26
          pod --version
      - name: Install checksum-pinned Flutter 3.41.9
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive=flutter_macos_arm64_3.41.9-stable.zip
              digest=d692b030a63466c44d6b2bc88583380371ecbe328f22cc4057835f59739821a1
              ;;
            x86_64)
              archive=flutter_macos_3.41.9-stable.zip
              digest=eaee3b6aa6da114eb0be843ac53f4f138d3d8827779ff1e4546b345c75b9cba1
              ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 2 --retry-all-errors --max-time 900 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive" \
            --output "$RUNNER_TEMP/flutter-sdk.zip"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/flutter-sdk.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/era-flutter"
          ditto -x -k "$RUNNER_TEMP/flutter-sdk.zip" "$RUNNER_TEMP/era-flutter"
          rm "$RUNNER_TEMP/flutter-sdk.zip"
          test "$(git -C "$RUNNER_TEMP/era-flutter/flutter" rev-parse HEAD)" = 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
          echo "$RUNNER_TEMP/era-flutter/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies and prepare iOS toolchain
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          flutter --version
          flutter precache --ios
          flutter pub get --enforce-lockfile
      - name: Analyze and run existing synthetic tests
        if: inputs.capture_review_guide || !inputs.capture_ipad_screenshot
        run: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Compile unsigned iOS release and simulator app
        if: inputs.capture_review_guide || !inputs.capture_ipad_screenshot
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug
      - name: Compile simulator only for supplemental store screenshot
        if: inputs.capture_ipad_screenshot && !inputs.capture_review_guide
        run: flutter build ios --simulator --debug
      - name: Record compiled identity and limits
        env:
          ERA_SOURCE_SHA: ${{ needs.provenance.outputs.source_sha }}
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          if test ! -f "$plist"; then plist=build/ios/iphonesimulator/Runner.app/Info.plist; fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.eraprojects.erawallet
          {
            echo '## Unsigned compiled identity'
            printf 'Source: `%s`\n\n' "$ERA_SOURCE_SHA"
            xcodebuild -version
            echo
            shasum -a 256 "${plist%/Info.plist}/Runner"
            echo
            echo 'No signing credentials were used; no IPA, TestFlight upload or App Review submission was produced.'
            echo 'Simulator compilation is not UI testing or physical-device qualification.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture first-run screen on a fresh 13-inch iPad simulator
        if: inputs.capture_ipad_screenshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          def sim_list(kind):
              return json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', kind, '-j']))

          types = sim_list('devicetypes')['devicetypes']
          matches = [item for item in types if 'iPad Pro 13-inch' in item['name']]
          if not matches:
              raise SystemExit('No 13-inch iPad Pro simulator device type is installed')
          runtimes = sim_list('runtimes')['runtimes']
          ios = [item for item in runtimes if item.get('isAvailable') and item['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS simulator runtime is installed')
          ios.sort(key=lambda item: tuple(int(part) for part in item['version'].split('.')), reverse=True)
          device = matches[-1]
          runtime = ios[0]
          uuid = subprocess.check_output(['xcrun', 'simctl', 'create', 'ERA Wallet App Store iPad 13', device['identifier'], runtime['identifier']], text=True).strip()
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'era-ipad-simulator-uuid'), 'w', encoding='utf-8') as out:
              out.write(uuid)
          print('Simulator:', device['name'], runtime['name'], uuid)
          PY
          uuid="$(cat "$RUNNER_TEMP/era-ipad-simulator-uuid")"
          python3 - "$uuid" <<'PY'
          import subprocess, sys
          subprocess.run(['xcrun','simctl','boot',sys.argv[1]],check=True,timeout=90)
          subprocess.run(['xcrun','simctl','bootstatus',sys.argv[1],'-b'],check=True,timeout=900)
          try:
              subprocess.run(['open','-g','-a','Simulator','--args','-CurrentDeviceUDID',sys.argv[1]],check=False,timeout=30)
          except subprocess.TimeoutExpired:
              print('Optional Simulator host launch timed out after device boot',flush=True)
          PY
          xcrun simctl install "$uuid" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$uuid" com.eraprojects.erawallet
          sleep 12
          capture="$RUNNER_TEMP/era-wallet-ipad-13-current-source.png"
          xcrun simctl io "$uuid" screenshot "$capture"
          width="$(sips -g pixelWidth "$capture" | awk '/pixelWidth/{print $2}')"
          height="$(sips -g pixelHeight "$capture" | awk '/pixelHeight/{print $2}')"
          case "$width x $height" in
            '2048 x 2732'|'2064 x 2752') ;;
            *) echo "Unexpected iPad screenshot dimensions: $width x $height" >&2; exit 1 ;;
          esac
          shasum -a 256 "$capture"
          printf '\nFresh simulator first-run screenshot: %s x %s. Inspect the image before App Store upload; this is not physical-device qualification.\n' "$width" "$height" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain iPad screenshot for visual review
        if: inputs.capture_ipad_screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: era-wallet-ipad-13-current-source-first-run
          path: ${{ runner.temp }}/era-wallet-ipad-13-current-source.png
          if-no-files-found: error
          retention-days: 7

      - name: Capture reviewer access on a disposable 11-inch iPad simulator
        if: inputs.capture_review_guide && !cancelled()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          def listing(kind):
              return json.loads(subprocess.check_output(['xcrun','simctl','list',kind,'--json']))[kind]
          devices = [d for d in listing('devicetypes') if 'iPad' in d['name'] and '11-inch' in d['name']]
          devices.sort(key=lambda d: ('Air' in d['name'] and 'M3' in d['name'], 'Air' in d['name']))
          runtimes = [r for r in listing('runtimes') if r.get('isAvailable') and '.iOS-' in r['identifier']]
          runtimes.sort(key=lambda r: tuple(map(int,r['version'].split('.'))))
          assert devices and runtimes, '11-inch iPad/iOS simulator unavailable'
          device, runtime = devices[-1], runtimes[-1]
          uid = subprocess.check_output(['xcrun','simctl','create','ERA disposable review access',device['identifier'],runtime['identifier']],text=True).strip()
          open(os.path.join(os.environ['RUNNER_TEMP'],'review-simulator-id'),'w').write(uid)
          os.makedirs('build/review-access-captures',exist_ok=True)
          json.dump({'simulator':device['name'],'runtime':runtime['name'],'udid':uid,'source':os.environ.get('REVIEW_SOURCE'),'physical_device':False},open('build/review-access-captures/device.json','w'),indent=2)
          PY
          uid="$(cat "$RUNNER_TEMP/review-simulator-id")"
          python3 - <<'PY'
          import os, subprocess
          uid = open(os.path.join(os.environ['RUNNER_TEMP'],'review-simulator-id')).read().strip()
          def checked(label, command, seconds):
              print('REVIEW_CAPTURE_STAGE:', label, flush=True)
              subprocess.run(command, check=True, timeout=seconds)
              print('REVIEW_CAPTURE_STAGE_COMPLETE:', label, flush=True)
          checked('boot', ['xcrun','simctl','boot',uid], 90)
          # CoreSimulator runs the fresh device headlessly. LaunchServices can
          # wait indefinitely for the Simulator GUI while its first boot is
          # still initializing (run 44370955567). The Flutter driver needs the
          # booted device, not a foreground Simulator window.
          checked('boot readiness', ['xcrun','simctl','bootstatus',uid,'-b'], 900)
          try:
              checked('optional simulator host after boot', ['open','-g','-a','Simulator','--args','-CurrentDeviceUDID',uid], 30)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              print('Optional Simulator host unavailable; continuing with booted CoreSimulator',flush=True)
          try:
              checked('cosmetic status bar', ['xcrun','simctl','status_bar',uid,'override','--time','9:41','--batteryState','charged','--batteryLevel','100'], 30)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
              # A cosmetic override must not prevent genuine UI qualification.
              print('Status-bar override unavailable:', type(exc).__name__, flush=True)
          checked('review access integration test', ['flutter','drive','--no-pub','--driver=test_driver/review_access_driver.dart','--target=integration_test/review_access_test.dart','-d',uid], 1200)
          PY
        env:
          REVIEW_SOURCE: ${{ needs.provenance.outputs.source_sha }}
      - name: Export safe frames from only the disposable app container
        if: inputs.capture_review_guide && always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          marker = pathlib.Path(os.environ['RUNNER_TEMP'])/'review-simulator-id'
          if marker.is_file():
              uid = marker.read_text().strip()
              try:
                  result = subprocess.run(['xcrun','simctl','get_app_container',uid,'com.eraprojects.erawallet','data'], capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print('Disposable container lookup timed out; no UI captures claimed',flush=True)
                  raise SystemExit(0)
              if result.returncode == 0:
                  source = pathlib.Path(result.stdout.strip())/'tmp'/'era-review-access-captures'
                  destination = pathlib.Path('build/review-access-captures')
                  destination.mkdir(parents=True,exist_ok=True)
                  if source.is_dir():
                      for frame in sorted(source.glob('*.png')):
                          shutil.copy2(frame,destination/frame.name)
                      print('Exported safe frames:',len(list(destination.glob('*.png'))),flush=True)
              else:
                  print('Disposable app container unavailable; no UI captures claimed',flush=True)
          PY
      - name: Retain reviewer captures for visual inspection
        if: inputs.capture_review_guide && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: era-wallet-review-access-captures
          path: era-wallet/build/review-access-captures
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only the disposable capture simulators
        if: (inputs.capture_review_guide || inputs.capture_ipad_screenshot) && always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          for marker_name in ['review-simulator-id','era-ipad-simulator-uuid']:
            marker = pathlib.Path(os.environ['RUNNER_TEMP'])/marker_name
            if not marker.is_file():
              continue
            if marker.is_file():
              uid = marker.read_text().strip()
              print('Removing only disposable review simulator:', uid, flush=True)
              try:
                  subprocess.run(['xcrun','simctl','shutdown',uid], timeout=60, check=False)
              except subprocess.TimeoutExpired:
                  print('Shutdown timed out; attempting UUID-scoped deletion', flush=True)
              subprocess.run(['xcrun','simctl','delete',uid], timeout=60, check=True)
              listing = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','--json'], timeout=60))
              assert all(d['udid'] != uid for group in listing['devices'].values() for d in group), 'Disposable simulator still present'
              print('DISPOSABLE_REVIEW_SIMULATOR_REMOVED', flush=True)
          PY

# Deliberately no push/PR triggers, secrets, cache or signed binary uploads.
