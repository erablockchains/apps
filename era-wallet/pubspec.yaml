name: era_wallet
description: ERA Wallet for managing ERA chain accounts, staking, and transfers.
publish_to: "none"
version: 1.2.0+9

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  polkadart: ^0.7.1
  polkadart_keyring: ^0.7.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  bip39: ^1.0.6
  bip39_mnemonic: ^3.0.10
  provider: ^6.0.5
  quiver: ^3.2.2
  substrate_metadata: ^1.5.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  local_auth: ^3.0.0
  cryptography: ^2.9.0
  ss58: ^1.3.1
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  video_player: ^2.8.0
  url_launcher: ^6.3.2
  # 2.4.7 declares native Android/iOS plugin classes and must be included in
  # platform builds; keeping it as dev-only produces an invalid registrant.
  flutter_native_splash: ^2.4.6
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  polkadart_cli: ^0.7.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/era_app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/images/era_app_icon.png
  windows:
    generate: true
    image_path: assets/images/era_app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/era_app_icon.png
  web:
    generate: true
    image_path: assets/images/era_app_icon.png
    background_color: "#0B1220"
    theme_color: "#0B1220"

flutter_native_splash:
  color: "#0B1220"
  image: assets/images/era_app_icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0B1220"
    image: assets/images/era_app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/era_icon.png
    - assets/images/era_app_icon.png
